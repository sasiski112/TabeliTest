<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabel</title>
</head>
<body>
<table border="1" style="border-collapse: collapse; text-align: center; width: 25%; height: 350px;">
  <tr>
    <td colspan="5">1</td>
    <td></td>
  </tr>
  <tr>
    <td id="2" colspan="2">2</td>
    <td id="3" colspan="3">3</td>
    <td id="4" rowspan="4">4</td>
  </tr>
  <tr>
    <td id="5" rowspan="2">5</td>
    <td id="A" colspan="3">A</td>
  </tr>
  <tr>
    <td id="6" colspan="1">6</td>
    <td id="7" colspan="1">7</td>
    <td id="8" colspan="1">8</td>
  </tr>
</table>
</body>
</html>
